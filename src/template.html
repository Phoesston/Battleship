<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>battleship</title>
</head>
<body>
   
  <div id="menu-screen">

    <h1>Battleship</h1>

    <button id="pvpBtn">Player vs Player</button>
    <button id="pvcBtn">Player vs Computer</button>
  </div>

 
  <div id="placement-screen" class="hidden">
        <h2>Place Your Ships</h2>

        <div id="ship-container">
            <div class="ship" draggable="true" data-size="5">Carrier</div>
            <div class="ship" draggable="true" data-size="4">Battleship</div>
            <div class="ship" draggable="true" data-size="3">Cruiser</div>
            <div class="ship" draggable="true" data-size="3">Submarine</div>
            <div class="ship" draggable="true" data-size="2">Destroyer</div>
        </div>

        <div id="player-board-container" class="board"></div>
        <button id="start-game-btn">Start Game</button>
    </div>

  
  <div id="game-screen" class="hidden">

    <h2>Battle!</h2>

    <div id="boards-container">
      <div id="player-board"></div>
      <div id="opponent-board"></div>
    </div>

    <p id="turn-info"></p>
  </div>
    

</body>
</html>
